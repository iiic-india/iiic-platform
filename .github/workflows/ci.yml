# Checks on every pull request and on main (docs/10 M1, docs/12 §8).
# The header and cookie-inventory tests run with the end-to-end tests.
# Lighthouse CI, size-limit, knip, gitleaks and pnpm audit join in a later M1 slice.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iiic
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d iiic"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # A throwaway secret for the CI database only; real secrets live in Vercel.
      PAYLOAD_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/iiic
      # Lets the cookie-inventory test check the owner setup link's cookie (D-41); CI only.
      OWNER_SETUP_TOKEN: ci-only-owner-setup-token-not-used-anywhere-else-0000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Formatting
        run: pnpm format:check
      - name: Types
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test:unit
      - name: Migrations
        run: pnpm migrate
      - name: Integration tests
        run: pnpm test:int
      - name: Build
        run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests (desktop and phone, with axe)
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
