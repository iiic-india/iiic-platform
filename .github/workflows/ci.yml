# Checks on every pull request and on main (docs/10 M1, docs/12 §8).
# The header and cookie-inventory tests run with the end-to-end tests; Lighthouse CI holds the
# budgets of docs/12 §2, pnpm audit the dependencies and gitleaks the history (docs/12 §5).
# Only public values may carry the NEXT_PUBLIC_ prefix, which lets Next.js put them in the
# browser's bundle (docs/12 §5): SITE_URL, INSTITUTE_URL, CF_WEB_ANALYTICS_TOKEN and SENTRY_DSN.
# A new public variable joins that list in the pull request that adds it.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iiic
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d iiic"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # A throwaway secret for the CI database only; real secrets live in Vercel.
      PAYLOAD_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/iiic
      # Lets the cookie-inventory test check the owner setup link's cookie (D-41); CI only.
      OWNER_SETUP_TOKEN: ci-only-owner-setup-token-not-used-anywhere-else-0000
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, for the secret scan.
          fetch-depth: 0
      - name: Secret scan (gitleaks, whole history)
        run: >-
          docker run --rm
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*'
          -v "${{ github.workspace }}:/repo"
          zricethezav/gitleaks:v8.18.4
          detect --source=/repo --config=/repo/.gitleaks.toml --redact --no-banner --verbose
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (a high or critical finding fails)
        run: pnpm audit --audit-level high
      - name: Formatting
        run: pnpm format:check
      - name: Only public values behind NEXT_PUBLIC_ (docs/12 §5)
        run: |
          allowed='^NEXT_PUBLIC_(SITE_URL|INSTITUTE_URL|CF_WEB_ANALYTICS_TOKEN|SENTRY_DSN)$'
          found=$(grep -rhoE 'NEXT_PUBLIC_[A-Z0-9_]+' src next.config.ts .env.example | sort -u)
          unknown=$(printf '%s\n' "$found" | grep -vE "$allowed" || true)
          if [ -n "$unknown" ]; then echo "Not on the list of public values (docs/12 §5): $unknown"; exit 1; fi
      - name: Types
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test:unit
      - name: Migrations
        run: pnpm migrate
      - name: Integration tests
        run: pnpm test:int
      - name: Build
        run: pnpm build
      # The browser download is the slowest and least steady step, so it is kept between runs,
      # keyed by the Playwright version.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm -s exec playwright --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - name: Restore the browser
        id: browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.browser.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Chromium's system libraries
        if: steps.browser.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: End-to-end tests (desktop and phone, with axe)
        run: pnpm test:e2e
      - name: Lighthouse budgets (docs/12 §2)
        run: pnpm exec lhci autorun
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            .lighthouseci/
          # .lighthouseci/ starts with a dot: upload-artifact leaves hidden folders out unless told,
          # and a failed budget is only explained by its reports.
          include-hidden-files: true
          retention-days: 7
