# Local Postgres for development (docs/07, Environments). Supabase runs Postgres 17.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: iiic
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d iiic']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
