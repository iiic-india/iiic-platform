# Secret scanning in CI (docs/12 §5): gitleaks' default rules over the whole history, minus the
# obviously fake values the tests and CI use, which are named so that nobody mistakes them.
[extend]
useDefault = true

[allowlist]
description = "Obviously fake test and CI values"
regexes = [
  '''ci-only-[A-Za-z0-9-]+''',
  '''test-only-[A-Za-z0-9-]+''',
  '''local-only-dummy-[A-Za-z0-9-]+''',
  '''JBSWY3DPEHPK3PXP''',
  # The alphabet and the digits: a made-up token one test used (commit ed9e7cd) before it took the
  # test-only- form. It stays in the history, so it is named here.
  '''abcdefghijklmnopqrstuvwxyz0123456789ABCD''',
  # The hex digits in order, twice: the made-up Cloudflare Web Analytics token in the beacon's
  # tests (commits eb939f1 and ce88f0e). The real token is public by design: it ships in the page.
  '''0123456789abcdef0123456789abcdef''',
  # A made-up link token with a signature of twenty As: the "guessed" token in M6's test of the
  # unsubscribe and withdrawal links (commit 5857b51). It was never signed with any key.
  '''eyJhbGciOiJIUzI1NiJ9\.eyJwIjoid2l0aGRyYXciLCJzIjo0Mn0\.AAAAAAAAAAAAAAAAAAAA''',
]
