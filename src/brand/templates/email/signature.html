<!-- IIIC email signature · paste into Gmail (Settings → Signature) or Outlook as HTML.
     Replace {{merge_fields}} and host mark-email-160.png at {{ASSET_URL}}. -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:20px;color:#1C262B;">
  <tr>
    <td valign="top" style="padding-right:16px;">
      <img src="{{ASSET_URL}}/mark-email-160.png" width="34" height="60" alt="IIIC" style="display:block;border:0;width:34px;height:60px;">
    </td>
    <td valign="top" style="padding-left:2px;">
      <span style="font-family:Georgia,'Times New Roman',serif;font-size:17px;line-height:22px;color:#1C262B;">{{name}}</span><br>
      <span style="color:#43525A;">{{title}}</span> · <span style="color:#5E6C74;">Indian Institute of Image Catalysts</span><br>
      <span style="color:#43525A;">{{phone}} · <a href="mailto:{{email}}" style="color:#1C262B;text-decoration:none;">{{email}}</a> · <a href="{{SITE_URL}}" style="color:#1C262B;text-decoration:underline;">{{SITE_DISPLAY}}</a></span><br>
      <span style="color:#5E6C74;font-size:12px;">408, The Claywalls, Hebatpur Road, Thaltej, Ahmedabad 382455</span>
    </td>
  </tr>
</table>
